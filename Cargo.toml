[workspace]
resolver = "2"
members = [
    "core",
    "backends",
    "backends-cpu",
    "backends-cuda",
    "runtime",
    "playground",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/vansweej/graphynx"

[workspace.dependencies]
# External
bytemuck    = { version = "1", features = ["derive"] }
cpal        = "0.15"
cudarc      = { version = "0.9", default-features = false, features = ["driver", "std"] }
env_logger  = "0.11"
hound       = "3"
log         = "0.4"
num-complex = "0.4"
ron         = "0.8"
rustfft     = "6"
serde       = { version = "1", features = ["derive"] }
tempfile    = "3"
thiserror   = "2"

# Workspace-internal
graph-core    = { path = "core", version = "0.1.0" }
backends      = { path = "backends", version = "0.1.0" }
backends-cpu  = { path = "backends-cpu", version = "0.1.0" }
backends-cuda = { path = "backends-cuda", version = "0.1.0" }
runtime       = { path = "runtime", version = "0.1.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)', 'cfg(tarpaulin_include)'] }
